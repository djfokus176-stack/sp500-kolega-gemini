name: SP500 AI Pro 24-7 Runner

on:
  schedule:
    - cron: '*/30 8-22 * * 1-5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: POBIERANIE KODU
        uses: actions/checkout@v4

      - name: KONFIGURACJA PYTHON
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: INSTALACJA BIBLIOTEK
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: URUCHOMIENIE SILNIKA HANDLOWEGO
        env:
          CAPITAL_LOGIN: ${{ secrets.CAPITAL_LOGIN }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python app.py --run-headless
